<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; min-height: 100dvh; }
#root { width: 100%; }
.app-container {
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 100dvh;
  background: #ccc;
}
.header { height: 100px; background: pink; min-width: 0; }
.main-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: lightblue;
  min-width: 0;
}
.card {
  width: 300px; height: 340px; background: white;
}
</style>
</head>
<body>
  <div id="root">
    <div class="app-container">
      <div class="header">Header</div>
      <div class="main-content">
        <div class="card">Card</div>
      </div>
    </div>
  </div>
</body>
</html>
